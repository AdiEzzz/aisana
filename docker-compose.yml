services:
  db:
    image: postgres:16-alpine
    container_name: ai_map_kz_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ai_map_kz
    # Порт наружу НЕ пробрасываем — БД доступна только внутри docker-сети.
    # Для локального доступа (Prisma Studio, pgAdmin) временно раскомментируй,
    # но только с привязкой к 127.0.0.1:
    # ports:
    #   - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: ai_map_kz_migrate
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/ai_map_kz
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_map_kz_app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/ai_map_kz
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NODE_ENV: production
      # Публичный адрес портала — используется в sitemap.xml и OpenGraph.
      # В проде поставь в .env реальный домен, например https://aimap.edu.kz
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backup:
    image: postgres:16-alpine
    container_name: ai_map_kz_backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: ['sh', '/backup.sh']
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    external: true
    name: ai_mapkz_postgres_data
  uploads_data:
